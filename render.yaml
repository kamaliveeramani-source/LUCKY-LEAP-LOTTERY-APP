# Lucky Leap — Render Blueprint
# The frontend is a static site and the backend is the API web service.

services:
  - type: static_site
    name: thumbi-lotteries-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://lucky-leap-lottery-app.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: lucky-leap-lottery-app
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
