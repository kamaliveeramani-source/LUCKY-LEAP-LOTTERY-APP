# Lucky Leap — Render Blueprint
# Web service: builds the Vite/React frontend and serves it from Express.
# Non-/api routes fall back to index.html so React Router handles SPA paths.

services:
  - type: web
    name: lucky-leap-lottery-app
    runtime: node
    rootDir: .
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build && npm --prefix backend ci
    startCommand: npm --prefix backend start
    envVars:
      - key: NODE_ENV
        value: production
